[package]
name = "host-android"
version = "0.1.0"
edition = "2021"
description = "Qianxian Native Android Host with In-Process Embedded LLM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[features]
default = []
mock-engine = []

[package.metadata.makepad.android]
package_name = "dev.aurorax.qianxian"
activity = "MakepadApp"
min_sdk_version = 26
target_sdk_version = 34
